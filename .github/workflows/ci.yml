name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  linux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: docker build --tag netsandbox-e2e tests/e2e
      - run: >-
          docker run --rm --privileged
          --volume "$PWD/target/release/netsandbox:/opt/netsandbox:ro"
          netsandbox-e2e
          /usr/local/bin/linux-host-scenario
      - uses: actions/upload-artifact@v4
        with:
          name: netsandbox-linux-guest-amd64
          path: target/release/netsandbox

  macos-test:
    needs: linux-e2e
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/download-artifact@v4
        with:
          name: netsandbox-linux-guest-amd64
          path: artifacts
      - run: chmod 755 artifacts/netsandbox
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: >-
          NETSANDBOX_EMBED_LINUX_GUEST="$PWD/artifacts/netsandbox"
          cargo build --release --locked
      - run: target/release/netsandbox --version
